# Keep tmux's native chooser secondary text in step with the active flavor.
# choose-tree uses `themelightgrey` for its dimmed rows on both client themes.
set -gF light-theme-light-grey "#{@thm_subtext_0}"
set -gF dark-theme-light-grey "#{@thm_subtext_0}"

# Catppuccin styling for choose-tree borders, preview pane, and active row.
set -gF tree-mode-border-style "fg=#{@thm_overlay_1},bg=#{@thm_mantle}"
# Preview context is only available when the chooser draws each label.
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@thm_green},#{@thm_blue}},bg=#{@thm_surface_0}"
set -gF tree-mode-selection-style "fg=#{@thm_fg},bg=#{@thm_surface_1},bold"
