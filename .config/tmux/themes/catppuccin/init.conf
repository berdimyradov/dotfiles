# ==========================
# THEME
# ==========================

# Add the Catppuccin plugin:
set -g @plugin 'catppuccin/tmux'
set -s theme detect

# Status line options - https://github.com/catppuccin/tmux/blob/main/docs/reference/configuration.md#status-line
set -g @catppuccin_status_background "default"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Window - https://github.com/catppuccin/tmux/blob/main/docs/reference/configuration.md#window
set -g @catppuccin_window_status_style "rounded" # Options: basic, rounded, slanted, custom, none
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# Native tmux appearance reports are serialized on the server command queue.
set-hook -g 'client-light-theme[100]' { run-shell '"$HOME/.config/tmux/themes/catppuccin/apply.sh" --socket #{q:socket_path} light' }
set-hook -g 'client-dark-theme[100]' { run-shell '"$HOME/.config/tmux/themes/catppuccin/apply.sh" --socket #{q:socket_path} dark' }

# Force a refresh on config reload; startup selects the reported client theme
# or falls back to the macOS appearance setting when the client is unknown.
run-shell '"$HOME/.config/tmux/themes/catppuccin/apply.sh" --socket #{q:socket_path} auto --force'

# Reset
# source-file ~/.config/tmux/themes/catppuccin/reset.conf
